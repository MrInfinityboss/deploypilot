services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deploypilot
      POSTGRES_PASSWORD: deploypilot
      POSTGRES_DB: deploypilot
    ports: ["5432:5432"]
    volumes: [deploypilot-postgres:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [deploypilot-redis:/data]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    depends_on: [postgres, redis]
    ports: ["4000:4000"]

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: ../.env
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on: [postgres, redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploypilot-workspaces:/workspaces

volumes:
  deploypilot-postgres:
  deploypilot-redis:
  deploypilot-workspaces:
